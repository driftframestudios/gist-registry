<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 510" role="img" aria-labelledby="title desc">
<title id="title">Observed support stays visible across a missing visit</title>
<desc id="desc">Synthetic unit A has values 0, 4, missing, and 3 on January 1, 3, 5, and 9. Unit B has one value, 8, on January 2. Only A’s January 1 and 3 observations connect. Exact records accompany the figure.</desc>
<rect width="820" height="510" fill="#ffffff"/>
<g font-family="sans-serif" fill="#172b4d">
<text x="40" y="36" font-size="23">Follow observations, preserve the gap</text>
<text x="40" y="65" font-size="16">Synthetic measurements • January 2024 • partial period</text>
<text x="40" y="95" font-size="15">Value (authored units); actual elapsed days on the horizontal axis</text>
<path d="M80,350.0 H680" stroke="#d7dde5"/>
<text x="65" y="355.0" text-anchor="end" font-size="14">0</text>
<path d="M80,300.0 H680" stroke="#d7dde5"/>
<text x="65" y="305.0" text-anchor="end" font-size="14">2</text>
<path d="M80,250.0 H680" stroke="#d7dde5"/>
<text x="65" y="255.0" text-anchor="end" font-size="14">4</text>
<path d="M80,200.0 H680" stroke="#d7dde5"/>
<text x="65" y="205.0" text-anchor="end" font-size="14">6</text>
<path d="M80,150.0 H680" stroke="#d7dde5"/>
<text x="65" y="155.0" text-anchor="end" font-size="14">8</text>
<text x="80" y="380" text-anchor="middle" font-size="14">Jan 1</text>
<text x="230" y="380" text-anchor="middle" font-size="14">Jan 3</text>
<text x="380" y="380" text-anchor="middle" font-size="14">Jan 5</text>
<text x="680" y="380" text-anchor="middle" font-size="14">Jan 9</text>
<path d="M380,120 V350" stroke="#777777" stroke-dasharray="4 5"/>
<text x="395" y="137" font-size="14">A: expected visit missing</text>
<polyline data-records="a1 a2" points="80,350.0 230,250.0" fill="none" stroke="#005a8d" stroke-width="2"/>
<circle data-record="a1" cx="80" cy="350.0" r="5" fill="#005a8d"/>
<text x="90" y="341.0" font-size="15">A: 0</text>
<circle data-record="a2" cx="230" cy="250.0" r="5" fill="#005a8d"/>
<text x="240" y="241.0" font-size="15">A: 4</text>
<circle data-record="a4" cx="680" cy="275.0" r="5" fill="#005a8d"/>
<text x="690" y="266.0" font-size="15">A: 3</text>
<rect data-record="b1" x="150" y="145.0" width="10" height="10" fill="#9b4a00"/>
<text x="165" y="141.0" font-size="15">B: 8</text>
<text x="40" y="420" font-size="15">Circles: A • square: B. Lines relate observed endpoints.</text>
<text x="40" y="445" font-size="15">Missing visits split paths; isolated observations retain visible marks.</text>
<text x="40" y="475" font-size="14">Source: authored synthetic fixture. Companion: values.csv.</text>
</g></svg>
