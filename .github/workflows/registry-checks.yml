name: Registry checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".agents/runbooks/**"
      - ".agents/skills/**"
      - ".betterleaks.toml"
      - ".gitignore"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/registry-checks.yml"
      - "AGENTS.md"
      - "AI-DATA-USE.md"
      - "AUTHORS"
      - "LICENSE"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "observations/**"
      - "orientation/**"
      - "planning/**"
      - "registry.json"
      - "robots.txt"
      - "schemas/**"
      - "snippets/**"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            snippets/typed-absence-and-wire-shape/0.1.0/package-lock.json
            snippets/style-dictionary-dtcg-pipeline/0.1.0/package-lock.json
            snippets/react-aria-visual-contract-receiver/0.1.0/package-lock.json
            snippets/cross-browser-visual-contract-observer/0.1.0/package-lock.json
            snippets/visual-pattern-artifact-compiler/0.1.0/package-lock.json
            snippets/figma-variable-sync-reconciliation/0.1.0/package-lock.json

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Use the pinned uv tool
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "snippets/**/uv.lock"
          cache-local-path: ".artifacts/uv-cache"

      - name: Admit the Node.js runtime
        run: node tools/check-node-runtime.mjs

      - name: Install the locked Node toolchain
        run: npm ci --ignore-scripts

      - name: Run registry, schema, lint, and artifact checks
        run: npm test

      - name: Check pull-request patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  node-owned-graph-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The registry job runs the complete repository suite on Node 22.
        # These lanes repeat the complete Node-owned graph on the other floors.
        node-version: ["24.22.1", "26.12.1"]
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            snippets/typed-absence-and-wire-shape/0.1.0/package-lock.json
            snippets/style-dictionary-dtcg-pipeline/0.1.0/package-lock.json
            snippets/react-aria-visual-contract-receiver/0.1.0/package-lock.json
            snippets/cross-browser-visual-contract-observer/0.1.0/package-lock.json
            snippets/visual-pattern-artifact-compiler/0.1.0/package-lock.json
            snippets/figma-variable-sync-reconciliation/0.1.0/package-lock.json

      - name: Admit the Node.js runtime
        run: node tools/check-node-runtime.mjs

      - name: Install the locked root toolchain
        run: npm ci --ignore-scripts

      - name: Exercise the complete Node-owned validation graph
        run: npm run test:node-owned

  visual-contract-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            snippets/react-aria-visual-contract-receiver/0.1.0/package-lock.json
            snippets/cross-browser-visual-contract-observer/0.1.0/package-lock.json
            snippets/visual-pattern-artifact-compiler/0.1.0/package-lock.json

      - name: Admit the Node.js runtime
        run: node tools/check-node-runtime.mjs

      - name: Install the locked browser-test toolchains
        run: npm run prepare:visual-contracts:browsers

      - name: Install the exact Playwright browser matrix
        working-directory: snippets/cross-browser-visual-contract-observer/0.1.0
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Exercise browser receipts and published artifact semantics
        run: npm run exercise:visual-contracts:browsers
