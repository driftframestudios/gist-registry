name: Registry checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".betterleaks.toml"
      - ".gitignore"
      - ".github/workflows/registry-checks.yml"
      - "AI-DATA-USE.md"
      - "AUTHORS"
      - "LICENSE"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "observations/**"
      - "registry.json"
      - "robots.txt"
      - "schemas/**"
      - "snippets/**"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            snippets/typed-absence-and-wire-shape/0.1.0/package-lock.json

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Use the pinned uv tool
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: "snippets/**/uv.lock"
          cache-local-path: ".artifacts/uv-cache"

      - name: Install the locked Node toolchain
        run: npm ci --ignore-scripts

      - name: Run registry, schema, lint, and artifact checks
        run: npm test

      - name: Check pull-request patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
