name: Secret-material boundary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-material-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-material:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Prepare the pinned secret-material reader
        run: npm run security:secrets:install

      - name: Prove and observe the candidate boundary
        run: |
          npm run test:secret-material
          npm run security:secrets
