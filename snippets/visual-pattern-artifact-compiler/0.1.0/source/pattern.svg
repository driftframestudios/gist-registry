<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="vf-title vf-desc">
  <title id="vf-title">Source-to-decision route</title>
  <desc id="vf-desc">Four connected panels trace a reviewed source through semantic translation and a receiving component to an accepted decision receipt.</desc>
  <defs>
    <pattern id="vf-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d5def5" stroke-width="1" />
    </pattern>
    <filter id="vf-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="8" dy="9" stdDeviation="0" flood-color="#12315b" />
    </filter>
    <marker id="vf-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#244dd8" />
    </marker>
    <style>
      .vf-label { font: 700 18px ui-sans-serif, system-ui, sans-serif; fill: #12315b; }
      .vf-body { font: 500 15px ui-sans-serif, system-ui, sans-serif; fill: #21365a; }
      .vf-step { font: 700 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.08em; fill: #244dd8; }
      @media (forced-colors: active) {
        .vf-card { fill: Canvas; stroke: CanvasText; }
        .vf-label, .vf-body, .vf-step { fill: CanvasText; }
        .vf-connector { stroke: LinkText; }
      }
      @media print {
        .vf-card { filter: none; }
      }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf4" />
  <rect x="28" y="28" width="1144" height="664" rx="18" fill="url(#vf-grid)" stroke="#12315b" stroke-width="3" />
  <text x="76" y="104" class="vf-step">VISUAL CONTRACT · SOURCE → RECEIVER → RECEIPT</text>
  <text x="76" y="154" class="vf-label" style="font-size: 32px">Carry meaning through every representation</text>
  <text x="76" y="190" class="vf-body">Each generated artifact retains one source identity, semantic companion, and reviewable publication coordinate.</text>
  <g data-layer="connectors" fill="none" stroke="#244dd8" stroke-width="8" class="vf-connector" marker-end="url(#vf-arrow)">
    <path d="M 300 384 H 354" />
    <path d="M 576 384 H 630" />
    <path d="M 852 384 H 906" />
  </g>
  <g data-layer="cards">
    <g class="vf-card" filter="url(#vf-shadow)">
      <rect x="72" y="258" width="228" height="260" rx="8" fill="#fff0c9" stroke="#12315b" stroke-width="3" />
      <rect x="72" y="258" width="228" height="52" rx="8" fill="#f2f748" stroke="#12315b" stroke-width="3" />
      <text x="92" y="291" class="vf-step">01 · SOURCE</text>
      <text x="92" y="354" class="vf-label">Reviewed source</text>
      <text x="92" y="390" class="vf-body"><tspan x="92" dy="0">Owner, meaning,</tspan><tspan x="92" dy="24">rights, dimensions,</tspan><tspan x="92" dy="24">and reading order.</tspan></text>
    </g>
    <g class="vf-card" filter="url(#vf-shadow)">
      <rect x="348" y="258" width="228" height="260" rx="8" fill="#dcecff" stroke="#12315b" stroke-width="3" />
      <rect x="348" y="258" width="228" height="52" rx="8" fill="#244dd8" stroke="#12315b" stroke-width="3" />
      <text x="368" y="291" class="vf-step" style="fill: #ffffff">02 · TRANSLATE</text>
      <text x="368" y="354" class="vf-label">Semantic target</text>
      <text x="368" y="390" class="vf-body"><tspan x="368" dy="0">SVG, responsive</tspan><tspan x="368" dy="24">images, gallery,</tspan><tspan x="368" dy="24">and companion data.</tspan></text>
    </g>
    <g class="vf-card" filter="url(#vf-shadow)">
      <rect x="624" y="258" width="228" height="260" rx="8" fill="#d8f1e8" stroke="#12315b" stroke-width="3" />
      <rect x="624" y="258" width="228" height="52" rx="8" fill="#59c3a5" stroke="#12315b" stroke-width="3" />
      <text x="644" y="291" class="vf-step">03 · RECEIVE</text>
      <text x="644" y="354" class="vf-label">Accessible view</text>
      <text x="644" y="390" class="vf-body"><tspan x="644" dy="0">Intrinsic size, alt,</tspan><tspan x="644" dy="24">caption, detail,</tspan><tspan x="644" dy="24">and reflow.</tspan></text>
    </g>
    <g class="vf-card" filter="url(#vf-shadow)">
      <rect x="900" y="258" width="228" height="260" rx="8" fill="#ffd9d5" stroke="#12315b" stroke-width="3" />
      <rect x="900" y="258" width="228" height="52" rx="8" fill="#ff7b6f" stroke="#12315b" stroke-width="3" />
      <text x="920" y="291" class="vf-step">04 · ACCEPT</text>
      <text x="920" y="354" class="vf-label">Decision receipt</text>
      <text x="920" y="390" class="vf-body"><tspan x="920" dy="0">Digests, runtime,</tspan><tspan x="920" dy="24">candidate standing,</tspan><tspan x="920" dy="24">and restart point.</tspan></text>
    </g>
  </g>
  <rect x="72" y="570" width="1056" height="82" rx="8" fill="#12315b" />
  <text x="96" y="604" class="vf-step" style="fill: #f2f748">CHANGED ABILITY</text>
  <text x="96" y="635" class="vf-body" style="fill: #ffffff">A receiving team can inspect the same meaning as pixels, structured data, readable prose, and an accepted publication coordinate.</text>
</svg>
