[project]
name = "gist-registry-migration-reconciliation-cutover"
version = "0.1.0"
description = "Migration reconciliation and approval-bound cutover conformance model"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
