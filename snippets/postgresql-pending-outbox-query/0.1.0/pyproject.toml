[project]
name = "gist-registry-postgresql-pending-outbox-query"
version = "0.1.0"
description = "PostgreSQL pending-count semantics and parity-bound partial-index observation"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]==3.3.6"]

[dependency-groups]
dev = ["ruff==0.16.4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
